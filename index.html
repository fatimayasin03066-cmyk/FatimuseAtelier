<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatimuse Atelier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header (Always Visible) -->
    <header class="site-header">
        <h1>Fatimuse Atelier</h1>
        <p class="subtitle">AN ARTIST'S PERSPECTIVE</p>
        <p class="quote">"Welcome to my Art Space. Where every stroke tells a story."</p>
    </header>

    <!-- Main Folder View (Home) -->
    <main id="home-view" class="container">
        <div class="folders-grid">
            <div class="folder-card" onclick="openCategory('paintings')">
                <div class="folder-icon">🎨</div>
                <h2>Paintings</h2>
                <p>Explore canvas & panel artwork</p>
            </div>
            <div class="folder-card" onclick="openCategory('sketches')">
                <div class="folder-icon">✏️</div>
                <h2>Sketches</h2>
                <p>Pencil & charcoal drawings</p>
            </div>
            <div class="folder-card" onclick="openCategory('calligraphy')">
                <div class="folder-icon">✒️</div>
                <h2>Calligraphy</h2>
                <p>Arabic script & canvas pieces</p>
            </div>
        </div>
    </main>

    <!-- Galleries (Hidden by default) -->
    <div id="gallery-view" class="container" style="display: none;">
        <button class="back-btn" onclick="goHome()">← Back to Folders</button>
             <!-- Paintings Section -->
        <section id="paintings-section" class="category-section" style="display: none;">
            <h2>Paintings</h2>
            <div class="image-grid">
                <img src="images/p1.jpg" alt="Painting 1">
                <img src="images/p2.jpg" alt="Painting 2">
                <img src="images/p3.jpg" alt="Painting 3">
                <img src="images/p4.jpg" alt="Painting 4">
                <img src="images/p5.jpg" alt="Painting 5">
                <img src="images/p6.jpg" alt="Painting 6">
                <img src="images/p7.jpg" alt="Painting 7">
                <img src="images/p8.jpg" alt="Painting 8">
                <img src="images/p9.jpg" alt="Painting 9">
            </div>
        </section>

        <!-- Sketches Section -->
        <section id="sketches-section" class="category-section" style="display: none;">
            <h2>Sketches</h2>
            <div class="image-grid">
                <img src="images/s1.jpg" alt="Sketch 1">
                <img src="images/s2.jpg" alt="Sketch 2">
                <img src="images/s3.jpg" alt="Sketch 3">
                <img src="images/s4.jpg" alt="Sketch 4">
                <img src="images/s5.jpg" alt="Sketch 5">
                <img src="images/s6.jpg" alt="Sketch 6">
                <img src="images/s7.jpg" alt="Sketch 7">
                <img src="images/s8.jpg" alt="Sketch 8">
                <img src="images/s9.jpg" alt="Sketch 9">
            </div>
        </section>

        <!-- Calligraphy Section -->
        <section id="calligraphy-section" class="category-section" style="display: none;">
            <h2>Calligraphy</h2>
            <div class="image-grid">
                <img src="images/c1.jpg" alt="Calligraphy 1">
                <img src="images/c2.jpg" alt="Calligraphy 2">
                <img src="images/c3.jpg" alt="Calligraphy 3">
            </div>
        </section>

                <!-- Add all your calligraphy images here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
