<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatimuse Atelier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Fatimuse Atelier</h1>
        <p class="subtitle">An Artist's Perspective</p>
        <p class="welcome">"Welcome to my Art Space. Where every stroke tells a story."</p>
    </header>

    <!-- Paintings Section -->
    <section class="gallery-section">
        <h2>Paintings</h2>
        <div class="grid">
            <!-- Add your 9 painting image names here -->
            <img src="Images/p1.jpg" alt="Painting">
            <img src="Images/p2.jpg" alt="Painting">
            <img src="Images/p3.jpg" alt="Painting">
            <img src="Images/p4.jpg" alt="Painting">
            <img src="Images/p5.jpg" alt="Painting">
            <img src="Images/p6.jpg" alt="Painting">
            <img src="Images/p7.jpg" alt="Painting">
            <img src="Images/p8.jpg" alt="Painting">
            <img src="Images/p9.jpg" alt="Painting">
        </div>
    </section>

    <!-- Sketches Section -->
    <section class="gallery-section">
        <h2>Sketches</h2>
        <div class="grid">
            <!-- Add your 9 sketch image names here -->
            <img src="Images/s1.jpg" alt="Sketch">
            <img src="Images/s2.jpg" alt="Sketch">
            <img src="Images/s3.jpg" alt="Sketch">
            <img src="Images/s4.jpg" alt="Sketch">
            <img src="Images/s5.jpg" alt="Sketch">
            <img src="Images/s6.jpg" alt="Sketch">
            <img src="Images/s7.jpg" alt="Sketch">
            <img src="Images/s8.jpg" alt="Sketch">
            <img src="Images/s9.jpg" alt="Sketch">
        </div>
    </section>

    <!-- Calligraphy Section -->
    <section class="gallery-section">
        <h2>Calligraphy</h2>
        <div class="grid">
            <!-- Add your 3 calligraphy image names here -->
            <img src="Images/c1.jpg" alt="Calligraphy">
            <img src="Images/c2.jpg" alt="Calligraphy">
            <img src="Images/c3.jpg" alt="Calligraphy">
        </div>
    </section>

</body>
</html>
